# Topologia OSPF del lab GNS3 (9 routers CHR en malla, R1..R9).
# Redes entre routers (una /24 exclusiva por par, la usa la app para el /30):
#   R1--R2  10.0.12.0/24
#   R1--R3  10.0.13.0/24
#   R2--R4  10.0.24.0/24
#   R2--R5  10.0.25.0/24
#   R3--R5  10.0.35.0/24
#   R3--R6  10.0.36.0/24
#   R4--R7  10.0.47.0/24
#   R5--R7  10.0.57.0/24
#   R5--R8  10.0.58.0/24
#   R6--R8  10.0.68.0/24
#   R7--R9  10.0.79.0/24
#   R8--R9  10.0.89.0/24
# La app NO depende de interfaces: por equipo se configura el router-id,
# el loopback (/32 del router-id) y las redes OSPF. OSPF se levanta solo
# en las interfaces que esten dentro de esas redes.
ospf:
  area: 0.0.0.0
  redistribute-connected: true
  equipos:
